# Malhae Daily: a morning brief at 06:00 and an evening brief at 20:00 Seoul time.
# The script is .github/scripts/daily_korean.py; the Gmail details are repository secrets, never in the code.
name: Daily Korean email

on:
  schedule:
    # GitHub often starts scheduled runs late, sometimes by hours, so each brief gets four early starts.
    # A run waits until exactly 06:00 or 20:00 Seoul time, and the brief is sent only once.
    # Times are UTC (Seoul is UTC+9); odd minutes avoid the busy top of the hour.
    - cron: "7 17,18,19,20 * * *"   # 02:07–05:07 in Seoul: the 06:00 morning brief
    - cron: "7 7,8,9,10 * * *"      # 16:07–19:07 in Seoul: the 20:00 evening brief
  workflow_dispatch:        # a "Run workflow" button on the Actions tab, for testing
    inputs:
      edition:
        description: "Which brief to send (auto waits for the next send time; morning or evening sends now)"
        type: choice
        options: [auto, morning, evening]
        default: auto

permissions:
  contents: read

# One run at a time: while one waits for the send time, the next waits in line, then sees the email was sent
concurrency:
  group: daily-korean-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # a run may wait up to about four hours for the send time
    steps:
      - name: Get the repository (the script and Malhae's phrasebook)
        uses: actions/checkout@v4

      - name: Send the email at 06:00 or 20:00 Seoul time
        run: python3 .github/scripts/daily_korean.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EDITION: ${{ inputs.edition || 'auto' }}
